<div
  class="card__headline headline"
  [class.is-left]="alignment === 'left'"
  [class.is-center]="alignment === 'center'"
>
  <h3
    class="headline__title"
    [class.is-mint-m]="titleColor === 'mint'"
    [class.is-blue-m]="titleColor === 'blue'"
    [class.is-grey-d]="titleColor === 'grey'"
  >
    {{ title }}
  </h3>
  <h4 class="headline__subtitle is-grey-md">{{ subtitle }}</h4>
</div>

<ng-content></ng-content>
